<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionGuide AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-gradient"></div>
    <div class="glass-card">
        <h1>Vision<span>Guide</span></h1>
        <div class="status-box">
            <span class="pulse"></span>
            <p id="status">Ready to Start</p>
        </div>
        
        <div class="counter-box">
            <h2 id="step-count">0</h2>
            <p>ESTIMATED STEPS</p>
        </div>

        <div class="controls">
            <button class="btn" onclick="startSystem()">INITIALIZE AI</button>
            <div class="voice-btns">
                <button class="btn-sm" onclick="setVoice('male')">MALE</button>
                <button class="btn-sm" onclick="setVoice('female')">FEMALE</button>
            </div>
        </div>
    </div>

    <video id="v" autoplay playsinline style="display:none"></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        let selectedVoice = "David";
        const v = document.getElementById('v');
        const c = document.getElementById('c');

        async function startSystem() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            v.srcObject = stream;
            document.getElementById('status').innerText = "AI Monitoring Active";
            speak("System initialized. Monitoring path.");
            setInterval(captureAndAnalyze, 8000);
        }

        async function captureAndAnalyze() {
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            const img = c.toDataURL('image/jpeg').split(',')[1];

            const res = await fetch('/api/chat', {
                method: 'POST',
                body: JSON.stringify({ image: img })
            });
            const data = await res.json();
            const text = data.choices[0].message.content;
            
            speak(text);
            const steps = text.match(/\d+/);
            if (steps) document.getElementById('step-count').innerText = steps[0];
        }

        function setVoice(g) {
            selectedVoice = g === 'male' ? 'David' : 'Zira';
            speak(g + " voice selected");
        }

        function speak(t) {
            const ut = new SpeechSynthesisUtterance(t);
            const vs = window.speechSynthesis.getVoices();
            ut.voice = vs.find(voice => voice.name.includes(selectedVoice));
            window.speechSynthesis.speak(ut);
        }
    </script>
</body>
</html>
